name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-test:
    name: build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites (BoringSSL needs cmake + Go)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Unit + in-process end-to-end tests
        run: cargo test

  interop:
    name: masque-go interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rapidmasque

      - name: Check out masque-go (reference implementation)
        uses: actions/checkout@v4
        with:
          repository: quic-go/masque-go
          path: masque-go

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rapidmasque

      - name: Run interop matrix
        working-directory: rapidmasque
        env:
          MASQUE_GO: ${{ github.workspace }}/masque-go
        run: ./testing/interop.sh

  # Release binaries. Built on every push/PR so a breakage on any platform
  # shows up before tagging; published as a GitHub release on tags.
  build-linux-musl:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - label: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Native build inside Alpine (no cross-compiling): a fully static binary.
      - name: Build static binary (Alpine)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 \
            .github/scripts/build-musl.sh "out/rapidmasque"
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Package
        run: .github/scripts/package.sh out/rapidmasque ${{ matrix.label }}

      - uses: actions/upload-artifact@v4
        with:
          name: rapidmasque-${{ matrix.label }}
          path: dist/*

  build-darwin:
    name: build (aarch64-apple-darwin)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          ./target/release/rapidmasque --version
          .github/scripts/package.sh target/release/rapidmasque aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: rapidmasque-aarch64-apple-darwin
          path: dist/*

  build-openbsd:
    name: build (${{ matrix.label }})
    # Same-architecture runners, so the VM never emulates a foreign CPU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-unknown-openbsd
            runner: ubuntu-24.04
            architecture: x86-64
          - label: aarch64-unknown-openbsd
            runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Start OpenBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          architecture: ${{ matrix.architecture }}
          version: "7.9"
          memory: 6G
          cpu_count: 4

      - name: Build (inside the VM)
        shell: cpa.sh {0}
        run: .github/scripts/build-openbsd.sh out/rapidmasque

      - name: Package
        run: .github/scripts/package.sh out/rapidmasque ${{ matrix.label }}

      - uses: actions/upload-artifact@v4
        with:
          name: rapidmasque-${{ matrix.label }}
          path: dist/*

  release:
    name: publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build-test, interop, build-linux-musl, build-darwin, build-openbsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rapidmasque-*
          merge-multiple: true

      - name: Combined checksums
        run: cat dist/*.sha256 | tee dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
