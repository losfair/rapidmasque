[package]
name = "rapidmasque"
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
strip = true

[[bin]]
name = "rapidmasque"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
base64ct = { version = "1", features = ["alloc"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-stream = "0.1"
# QUIC transport (n0's quinn fork): multipath + BBRv3. TLS is NOT rustls: we plug
# BoringSSL in through noq's `crypto` traits (`src/tls/`), so ECH termination and
# the SNI guard work exactly as in zeromasque. `ring` only backs the endpoint's
# stateless-reset HMAC and the (unused) retry-token key.
# Pinned to the losfair/noq fork for per-path scheduling priority, the path
# spill threshold and datagram queue management (not in upstream noq). Keep
# both crates on the same commit.
noq = { git = "https://github.com/losfair/noq", rev = "baad794ebd604b4b4f1c0ff71664a66af652c10d", default-features = false, features = ["runtime-tokio", "ring", "bloom", "tracing-log"] }
# Direct dep only for `coding::Encodable` (to read a `PathId` for the multipath
# AEAD nonce); same commit as noq's own.
noq-proto = { git = "https://github.com/losfair/noq", rev = "baad794ebd604b4b4f1c0ff71664a66af652c10d", default-features = false, features = ["ring", "bloom", "tracing-log"] }
# BoringSSL: the TLS 1.3 handshake (via its QUIC API), ECH, and packet
# protection (AEAD + header protection). boring 4 keeps the ECH code identical
# to zeromasque's.
boring = "4"
# Raw BoringSSL FFI: the QUIC handshake API (`SSL_set_quic_method`, ...), AEAD
# and HKDF primitives, and ECH HPKE keygen (boring 4's `PKey` has no X25519
# `generate`).
boring-sys = "4"
foreign-types-shared = "0.3"
